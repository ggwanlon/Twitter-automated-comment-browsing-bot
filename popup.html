<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --primary: #1d9bf0;
      --danger: #f4212e;
      --bg: #f7f9f9;
      --card: #ffffff;
      --border: #eff3f4;
      --text: #0f1419;
      --muted: #536471;
    }
    body{
      width:340px;
      margin:0;
      padding:16px;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      box-sizing:border-box;
    }
    .card{
      background:var(--card);
      border-radius:16px;
      padding:16px;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      margin-bottom:12px;
    }
    h3{
      margin:0 0 12px 0;
      font-size:16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .badge{
      font-size:11px; padding:2px 8px; border-radius:10px; font-weight:normal;
      background:#eee; color:#666;
    }
    .badge.running{ background:var(--primary); color:#fff; }
    .badge.stopped{ background:#eee; color:#666; }

    label{
      font-size:12px; font-weight:600; color:var(--muted);
      margin-top:12px; display:block; margin-bottom:4px;
    }
    input, textarea, select{
      width:100%; box-sizing:border-box;
      background:var(--bg); border:1px solid var(--border);
      border-radius:8px; padding:8px; font-size:13px; color:var(--text);
      outline:none; transition:border .2s;
    }
    input:focus, textarea:focus, select:focus{ border-color:var(--primary); }
    
    /* 隐藏类，用于自定义模型输入框的切换 */
    .hidden { display: none; }

    .stat-row {
      display: flex; justify-content: space-around;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .stat-item { text-align: center; }
    .stat-num { font-size: 18px; font-weight: 800; color: var(--primary); display: block; }
    .stat-label { font-size: 11px; color: var(--muted); }

    .error{
      color:var(--danger); font-size:12px; margin-top:8px;
      background:rgba(244,33,46,.1); padding:8px; border-radius:6px;
      display:none;
    }

    .actionWrap{ display:flex; justify-content:center; margin-top:10px; }
    #toggleBtn{
      width:78px; height:78px; border-radius:50%;
      border:none; cursor:pointer; color:#fff; font-weight:900;
      background:var(--primary);
      box-shadow:0 8px 18px rgba(29,155,240,.28);
    }
    #toggleBtn.stop{ background:var(--danger); box-shadow:0 8px 18px rgba(244,33,46,.22); }
    #toggleBtn:active{ transform:scale(.98); }

    .foot{ margin-top:10px; font-size:11px; color:#8899a6; text-align:center; line-height:1.35; }
  </style>
</head>
<body>
  <div class="card">
    <h3>配置 <span id="badge" class="badge stopped">已停止</span></h3>

    <label>API 网关 BaseUrl</label>
    <input id="apiUrl" placeholder="https://api.openai.com/v1" />

    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." />

    <label>AI 模型 Model</label>
    <select id="modelSelect">
        <option value="gpt-5-chat-latest">gpt-5-chat-latest (OpenAI)</option>
        <option value="gpt-5-mini">gpt-5-mini (OpenAI)</option>
        <option value="gpt-4o">GPT-4o (OpenAI)</option>
        <option value="gpt-4-turbo">GPT-4 Turbo (OpenAI)</option>
        <option value="claude-3-5-sonnet-20240620">Claude 3.5 Sonnet</option>
        <option value="claude-3-opus-20240229">Claude 3 Opus</option>
        <option value="gemini-pro">Gemini Pro</option>
        <option value="custom">自定义 (Custom)...</option>
    </select>
    <input id="modelName" class="hidden" placeholder="输入自定义模型名称" style="margin-top: 5px;" />

    <label>系统指令 (System Prompt)</label>
    <textarea id="systemPrompt" rows="3" placeholder="你是一个真实网友..."></textarea>
    
    <div id="error" class="error"></div>
  </div>

  <div class="card">
    <div class="stat-row">
      <div class="stat-item">
        <span id="count" class="stat-num">0</span>
        <span class="stat-label">已评论</span>
      </div>
      <div class="stat-item">
        <span id="likeCount" class="stat-num">0</span>
        <span class="stat-label">已点赞</span>
      </div>
    </div>
    <div class="actionWrap">
      <button id="toggleBtn">启动</button>
    </div>
    <div class="foot">打开 X/Twitter 页面后点击启动<br>每 2-3 分钟评论一次，每 20-40 秒点赞一次</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
